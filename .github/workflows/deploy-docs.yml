name: Deploy Documentation Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-docs.ya?ml"
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "examples/**"
  pull_request:
    paths:
      - ".github/workflows/deploy-docs.ya?ml"
      - "mkdocs.yml"
      - "docs/**"
      - "src/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r docs/requirements.txt
      - name: Build site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
